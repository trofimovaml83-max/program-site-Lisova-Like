<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мото Личный Кабинет</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏍️</text></svg>">
    
    <style>
        /* --- ПЕРЕМЕННЫЕ ДЛЯ ТЕМ --- */
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #2a2a35 0%, #111115 80%);
            --text-color: #ffffff;
            --card-bg: rgba(30, 30, 35, 0.85);
            --border-color: #ff4500;
            --accent-color: #ff4500;
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: #444;
            --btn-hover: #ff5722;
            --shadow-color: rgba(255, 69, 0, 0.3);
        }
        body.theme-light {
            --bg-gradient: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            --text-color: #333333;
            --card-bg: rgba(255, 255, 255, 0.95);
            --border-color: #007bff;
            --accent-color: #007bff;
            --input-bg: #f8f9fa;
            --input-border: #ccc;
            --btn-hover: #0056b3;
            --shadow-color: rgba(0, 123, 255, 0.3);
        }
        body.theme-dark {
            --bg-gradient: linear-gradient(135deg, #1e1e24 0%, #000000 100%);
            --text-color: #eeeeee;
            --card-bg: rgba(40, 40, 45, 0.9);
            --border-color: #555555;
            --accent-color: #888888;
            --input-bg: rgba(255, 255, 255, 0.1);
            --input-border: #666;
            --btn-hover: #666666;
            --shadow-color: rgba(255, 255, 255, 0.1);
        }

        body { 
            font-family: 'Segoe UI', -apple-system, sans-serif; 
            background: var(--bg-gradient);
            background-attachment: fixed;
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
            color: var(--text-color); transition: background 0.5s, color 0.5s;
        }

        .container { 
            background: var(--card-bg); backdrop-filter: blur(10px);
            padding: 30px; border-radius: 16px; border: 1px solid var(--border-color); 
            box-shadow: 0 0 20px var(--shadow-color); width: 100%; max-width: 420px; 
            transition: background 0.5s, border 0.5s, box-shadow 0.5s;
            max-height: 90vh; overflow-y: auto;
        }

        h1, h2 { text-align: center; color: var(--accent-color); text-shadow: 0 0 10px var(--shadow-color); margin-bottom: 20px; }

        input { 
            width: 100%; padding: 14px; margin: 8px 0; 
            background: var(--input-bg); border: 1px solid var(--input-border); 
            border-radius: 8px; box-sizing: border-box; font-size: 16px; 
            color: var(--text-color); transition: 0.3s;
        }
        input:focus { outline: none; border-color: var(--accent-color); box-shadow: 0 0 10px var(--shadow-color); }

        button { 
            width: 100%; padding: 12px; background: var(--accent-color); color: #fff; 
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; margin-top: 10px; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        button:hover { background: var(--btn-hover); box-shadow: 0 0 15px var(--shadow-color); }
        .btn-green { background: #333; border: 1px solid #555; }
        .btn-green:hover { background: #444; }
        .btn-link { background: none; color: #888; box-shadow: none; text-transform: none; font-size: 14px; font-weight: normal; margin-top: 15px; text-decoration: underline; }
        .btn-link:hover { color: var(--accent-color); background: none; }

        /* Стили для плеера и треков */
        .track { 
            background: var(--input-bg); padding: 12px; border-radius: 8px; 
            margin-top: 10px; display: flex; flex-direction: column; gap: 8px;
            border-left: 4px solid var(--accent-color); 
        }
        .track-title { font-weight: bold; font-size: 15px; }
        .track-actions { display: flex; gap: 8px; justify-content: space-between; }
        .track-actions button { margin: 0; padding: 6px; font-size: 12px; width: auto; flex: 1; }
        
        .btn-play { background: #28a745; }
        .btn-play:hover { background: #218838; }
        .btn-fav { background: #444; border: 1px solid #666; }
        .btn-fav:hover { background: #555; }
        .btn-fav.active { background: #ff4500; border-color: #ff4500; color: white; }
        .btn-download { background: #007bff; }
        .btn-download:hover { background: #0056b3; }

        .hidden { display: none; }
        .error { color: #ff5252; text-align: center; margin-bottom: 10px; font-weight: bold; }
        .success { color: #4caf50; text-align: center; margin-bottom: 10px; font-weight: bold; }

        .theme-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .theme-buttons button { margin-top: 0; padding: 10px; font-size: 14px; }

        audio { width: 100%; margin-top: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <!-- ЭКРАН 1: Вход -->
    <div id="auth-screen">
        <h1>🏍️ Вход</h1>
        <div id="auth-error" class="error"></div>
        <input type="text" id="username" placeholder="Логин">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()">Войти</button>
        <button class="btn-green" onclick="showScreen('register-screen')">Зарегистрироваться</button>
        <button class="btn-link" onclick="showScreen('recover-screen')">Забыли пароль?</button>
    </div>

    <!-- ЭКРАН 2: Регистрация -->
    <div id="register-screen" class="hidden">
        <h1>📝 Регистрация</h1>
        <div id="reg-error" class="error"></div>
        <div id="reg-success" class="success"></div>
        <input type="text" id="reg-username" placeholder="Придумайте логин">
        <input type="password" id="reg-password" placeholder="Придумайте пароль">
        <input type="tel" id="reg-phone" placeholder="Номер телефона">
        <input type="email" id="reg-email" placeholder="Электронная почта (Email)">
        <button onclick="register()">Создать аккаунт</button>
        <button class="btn-link" onclick="showScreen('auth-screen')">Назад ко входу</button>
    </div>

    <!-- ЭКРАН 3: Восстановление пароля -->
    <div id="recover-screen" class="hidden">
        <h1>🔑 Восстановление</h1>
        <div id="recover-error" class="error"></div>
        <div id="recover-success" class="success"></div>
        <p style="text-align: center; font-size: 14px; color: #888;">Введите вашу почту, и мы покажем пароль.</p>
        <input type="email" id="recover-email" placeholder="Ваш Email">
        <button onclick="recoverPassword()">Восстановить</button>
        <button class="btn-link" onclick="showScreen('auth-screen')">Назад ко входу</button>
    </div>

    <!-- ЭКРАН 4: Личный кабинет (МУЗЫКА) -->
    <div id="dashboard-screen" class="hidden">
        <h2>🎵 Мото-Радио</h2>
        <p style="text-align: center; margin-bottom: 20px;">Привет, <strong style="color: var(--accent-color);" id="user-display"></strong>!</p>
        
        <!-- Форма добавления трека -->
        <input type="text" id="track-name" placeholder="Название трека (например, Bass Boosted)">
        <input type="url" id="track-url" placeholder="Ссылка на MP3 (прямая ссылка)">
        <button onclick="addTrack()">➕ Добавить трек</button>
        
        <hr style="border-color: var(--input-border); margin: 20px 0;">

        <!-- Списки треков -->
        <h3 style="margin-bottom: 10px;">Все треки</h3>
        <div id="tracks-list"></div>
        
        <h3 style="margin-top: 20px; margin-bottom: 10px;">⭐ Избранное</h3>
        <div id="fav-list"></div>

        <button onclick="showScreen('settings-screen')" class="btn-green" style="margin-top: 20px;">⚙️ Настройки</button>
        <button onclick="logout()" class="btn-green" style="margin-top: 10px;">Выйти</button>
    </div>

    <!-- ЭКРАН 5: НАСТРОЙКИ -->
    <div id="settings-screen" class="hidden">
        <h2>⚙️ Настройки</h2>
        <p style="font-size: 14px; margin-bottom: 10px;">Выберите тему оформления:</p>
        <div class="theme-buttons">
            <button onclick="setTheme('neon')" style="background: #ff4500;">Неон</button>
            <button onclick="setTheme('light')" style="background: #007bff;">Светлая</button>
            <button onclick="setTheme('dark')" style="background: #444;">Темная</button>
        </div>
        <hr style="border-color: var(--input-border); margin: 20px 0;">
        <p style="font-size: 14px; margin-bottom: 10px;">Служба поддержки:</p>
        <button onclick="contactSupport()">✉️ Написать в поддержку</button>
        <button class="btn-link" onclick="showScreen('dashboard-screen')" style="margin-top: 20px;">Назад</button>
    </div>
</div>

<script>
    let users = JSON.parse(localStorage.getItem('myAppUsers')) || {};
    let currentUser = null;

    window.onload = function() {
        const savedTheme = localStorage.getItem('siteTheme') || 'neon';
        setTheme(savedTheme);
    };

    function saveUsers() { localStorage.setItem('myAppUsers', JSON.stringify(users)); }
    
    function setTheme(themeName) {
        document.body.className = '';
        if (themeName === 'light') document.body.classList.add('theme-light');
        else if (themeName === 'dark') document.body.classList.add('theme-dark');
        localStorage.setItem('siteTheme', themeName);
    }

    function contactSupport() {
        const email = "support@moto-site.ru"; // Ваша почта
        window.location.href = `mailto:${email}?subject=Вопрос в поддержку`;
    }

    function showScreen(screenId) {
        const screens = ['auth-screen', 'register-screen', 'recover-screen', 'dashboard-screen', 'settings-screen'];
        screens.forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
        
        document.getElementById('auth-error').innerText = '';
        document.getElementById('reg-error').innerText = '';
        document.getElementById('reg-success').innerText = '';
        document.getElementById('recover-error').innerText = '';
        document.getElementById('recover-success').innerText = '';
    }

    function register() {
        const u = document.getElementById('reg-username').value.trim();
        const p = document.getElementById('reg-password').value;
        const phone = document.getElementById('reg-phone').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const err = document.getElementById('reg-error');
        const succ = document.getElementById('reg-success');
        
        err.innerText = ''; succ.innerText = '';

        if (!u || !p || !phone || !email) return err.innerText = 'Заполните все поля!';
        if (users[u]) return err.innerText = 'Такой логин уже есть';
        
        // Создаем пустые массивы для треков и избранного
        users[u] = { password: p, phone: phone, email: email, tracks: [], favorites: [] };
        saveUsers();
        
        succ.innerText = '✅ Успешно! Теперь можете войти.';
        setTimeout(() => {
            showScreen('auth-screen');
            document.getElementById('username').value = u; 
        }, 1500);
    }

    function login() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        
        if (users[u] && users[u].password === p) {
            currentUser = u;
            document.getElementById('user-display').innerText = u;
            showScreen('dashboard-screen');
            renderTracks();
        } else {
            document.getElementById('auth-error').innerText = 'Неверный логин или пароль';
            setTimeout(() => document.getElementById('auth-error').innerText = '', 3000);
        }
    }

    function recoverPassword() {
        const email = document.getElementById('recover-email').value.trim();
        const err = document.getElementById('recover-error');
        const succ = document.getElementById('recover-success');
        err.innerText = ''; succ.innerText = '';

        if (!email) return err.innerText = 'Введите email';

        let foundUser = null;
        for (let login in users) {
            if (users[login].email === email) { foundUser = login; break; }
        }

        if (foundUser) {
            succ.innerHTML = `✅ Найдено!<br>Логин: <b>${foundUser}</b><br>Пароль: <b>${users[foundUser].password}</b>`;
        } else {
            err.innerText = 'Пользователь с такой почтой не найден.';
        }
    }

    function logout() {
        currentUser = null;
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        showScreen('auth-screen');
    }

    // --- ДОБАВЛЕНИЕ ТРЕКА ---
    function addTrack() {
        const name = document.getElementById('track-name').value.trim();
        const url = document.getElementById('track-url').value.trim();

        if (!name || !url) {
            alert("Заполните название и ссылку!");
            return;
        }

        // Добавляем трек в массив пользователя
        users[currentUser].tracks.push({ name: name, url: url });
        saveUsers();
        
        // Очищаем поля
        document.getElementById('track-name').value = '';
        document.getElementById('track-url').value = '';
        
        renderTracks();
    }

    // --- ОТРИСОВКА ТРЕКОВ ---
    function renderTracks() {
        const list = document.getElementById('tracks-list');
        const favList = document.getElementById('fav-list');
        list.innerHTML = '';
        favList.innerHTML = '';

        const tracks = users[currentUser].tracks || [];
        const favorites = users[currentUser].favorites || [];

        // 1. Отрисовка всех треков
        if (tracks.length === 0) {
            list.innerHTML = '<p style="color: #888; font-size: 14px;">Список пуст. Добавьте первый трек!</p>';
        } else {
            tracks.forEach((track, index) => {
                const isFav = favorites.some(f => f.url === track.url);
                const div = document.createElement('div');
                div.className = 'track';
                div.innerHTML = `
                    <div class="track-title">🎵 ${track.name}</div>
                    <audio controls src="${track.url}"></audio>
                    <div class="track-actions">
                        <button class="btn-fav ${isFav ? 'active' : ''}" onclick="toggleFavorite(${index})">
                            ${isFav ? '❤️ В избранном' : '🤍 В избранное'}
                        </button>
                        <button class="btn-download" onclick="downloadTrack('${track.url}', '${track.name}')">📥 Скачать</button>
                        <button style="background:#d32f2f;" onclick="deleteTrack(${index})">🗑️</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // 2. Отрисовка избранного
        if (favorites.length === 0) {
            favList.innerHTML = '<p style="color: #888; font-size: 14px;">Нет избранных треков.</p>';
        } else {
            favorites.forEach((track, index) => {
                const div = document.createElement('div');
                div.className = 'track';
                div.innerHTML = `
                    <div class="track-title">⭐ ${track.name}</div>
                    <audio controls src="${track.url}"></audio>
                    <div class="track-actions">
                        <button class="btn-fav active" onclick="removeFavorite(${index})">❌ Убрать</button>
                        <button class="btn-download" onclick="downloadTrack('${track.url}', '${track.name}')">📥 Скачать</button>
                    </div>
                `;
                favList.appendChild(div);
            });
        }
    }

    // --- ДОБАВИТЬ/УБРАТЬ ИЗ ИЗБРАННОГО ---
    function toggleFavorite(index) {
        const track = users[currentUser].tracks[index];
        const favorites = users[currentUser].favorites;
        
        // Проверяем, есть ли уже в избранном
        const favIndex = favorites.findIndex(f => f.url === track.url);
        
        if (favIndex === -1) {
            // Добавляем
            favorites.push(track);
        } else {
            // Удаляем
            favorites.splice(favIndex, 1);
        }
        
        saveUsers();
        renderTracks();
    }

    function removeFavorite(index) {
        users[currentUser].favorites.splice(index, 1);
        saveUsers();
        renderTracks();
    }

    // --- УДАЛИТЬ ТРЕК ---
    function deleteTrack(index) {
        if(confirm("Удалить этот трек?")) {
            users[currentUser].tracks.splice(index, 1);
            saveUsers();
            renderTracks();
        }
    }

    // --- СКАЧИВАНИЕ ---
    function downloadTrack(url, name) {
        // Создаем временную ссылку для скачивания
        const a = document.createElement('a');
        a.href = url;
        // Пытаемся дать файлу красивое имя
        a.download = name + ".mp3"; 
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>

</body>
</html>
