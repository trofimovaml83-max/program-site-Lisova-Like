<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мото Личный Кабинет</title>
    <style>
        /* --- МОТО-ФОН --- */
        body { 
            font-family: 'Segoe UI', -apple-system, sans-serif; 
            /* Темный градиент с имитацией неона */
            background: radial-gradient(circle at 50% 0%, #2a2a35 0%, #111115 80%);
            background-attachment: fixed;
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            padding: 20px; 
            margin: 0; 
            color: #fff;
        }

        /* --- СТИЛЬНАЯ КАРТОЧКА --- */
        .container { 
            background: rgba(30, 30, 35, 0.85); /* Полупрозрачный темный фон */
            backdrop-filter: blur(10px); /* Размытие заднего фона */
            padding: 30px; 
            border-radius: 16px; 
            border: 1px solid #ff4500; /* Оранжевая рамка (мото-цвет) */
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.3); /* Неоновое свечение */
            width: 100%; 
            max-width: 400px; 
        }

        h1, h2 { 
            text-align: center; 
            color: #ff4500; /* Оранжевый заголовок */
            text-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
            margin-bottom: 20px;
        }

        /* --- ПОЛЯ ВВОДА --- */
        input { 
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid #444; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            color: #fff;
            transition: 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #ff4500;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.3);
        }
        input::placeholder {
            color: #888;
        }

        /* --- КНОПКИ --- */
        button { 
            width: 100%; 
            padding: 14px; 
            background: #ff4500; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            margin-top: 15px; 
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover { 
            background: #ff5722; 
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.6);
        }

        .btn-green { 
            background: #333; 
            border: 1px solid #555;
        }
        .btn-green:hover { 
            background: #444; 
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* --- ЗАМЕТКИ --- */
        .note { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 12px; 
            border-radius: 8px; 
            margin-top: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-left: 4px solid #ff4500; 
        }
        .note button { 
            width: auto; 
            background: #d32f2f; 
            padding: 6px 12px; 
            font-size: 12px; 
            margin: 0; 
        }
        .note button:hover { 
            background: #f44336; 
        }

        .hidden { display: none; }
        .error { 
            color: #ff5252; 
            text-align: center; 
            margin-bottom: 10px; 
            font-weight: bold; 
            text-shadow: 0 0 5px rgba(255, 82, 82, 0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ЭКРАН 1: Вход и Регистрация -->
    <div id="auth-screen">
        <h1>🏍️ Добро пожаловать!</h1>
        <div id="auth-error" class="error"></div>
        <input type="text" id="username" placeholder="Логин">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()">Въехать на сайт (Войти)</button>
        <button class="btn-green" onclick="register()">Зарегистрироваться</button>
    </div>

    <!-- ЭКРАН 2: Личный кабинет -->
    <div id="dashboard-screen" class="hidden">
        <h2>Личный кабинет</h2>
        <p style="text-align: center;">Привет, <strong style="color: #ff4500;" id="user-display"></strong>!</p>
        
        <h3 style="margin-top: 30px;">📝 Мои заметки</h3>
        <div id="notes-list"></div>
        
        <input type="text" id="new-note" placeholder="Новая запись...">
        <button onclick="addNote()">Добавить запись</button>
        <button onclick="logout()" class="btn-green" style="margin-top: 20px;">Выйти</button>
    </div>
</div>

<script>
    // Загружаем пользователей из памяти браузера
    let users = JSON.parse(localStorage.getItem('myAppUsers')) || {};
    let currentUser = null;

    function saveUsers() {
        localStorage.setItem('myAppUsers', JSON.stringify(users));
    }

    // Переключение экранов
    function showScreen(screenId) {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('dashboard-screen').classList.add('hidden');
        document.getElementById(screenId).classList.remove('hidden');
    }

    function showError(msg) {
        const err = document.getElementById('auth-error');
        err.innerText = msg;
        setTimeout(() => err.innerText = '', 3000);
    }

    // ФУНКЦИЯ РЕГИСТРАЦИИ
    function register() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        
        if (!u || !p) return showError('Заполните все поля');
        if (users[u]) return showError('Такой логин уже есть');
        
        users[u] = { password: p, notes: [] };
        saveUsers();
        alert('✅ Регистрация успешна! Теперь войдите.');
    }

    // ФУНКЦИЯ ВХОДА
    function login() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        
        if (users[u] && users[u].password === p) {
            currentUser = u;
            document.getElementById('user-display').innerText = u;
            showScreen('dashboard-screen');
            renderNotes();
        } else {
            showError('Неверный логин или пароль');
        }
    }

    // ВЫХОД
    function logout() {
        currentUser = null;
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        showScreen('auth-screen');
    }

    // ОТРИСОВКА ЗАМЕТОК
    function renderNotes() {
        const list = document.getElementById('notes-list');
        list.innerHTML = '';
        const notes = users[currentUser].notes;
        
        if (notes.length === 0) {
            list.innerHTML = '<p style="color: #888; font-size: 14px;">Пока нет записей</p>';
        } else {
            notes.forEach((note, index) => {
                const div = document.createElement('div');
                div.className = 'note';
                div.innerHTML = `<span>${note}</span> <button onclick="deleteNote(${index})">Удалить</button>`;
                list.appendChild(div);
            });
        }
    }

    // ДОБАВЛЕНИЕ ЗАМЕТКИ
    function addNote() {
        const noteInput = document.getElementById('new-note');
        const text = noteInput.value.trim();
        if (text) {
            users[currentUser].notes.push(text);
            saveUsers();
            noteInput.value = '';
            renderNotes();
        }
    }

    // УДАЛЕНИЕ ЗАМЕТКИ
    function deleteNote(index) {
        users[currentUser].notes.splice(index, 1);
        saveUsers();
        renderNotes();
    }
</script>

</body>
</html>
