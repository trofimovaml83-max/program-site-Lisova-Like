<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мото Личный Кабинет</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏍️</text></svg>">
    <style>
        /* --- МОТО-ФОН --- */
        body { 
            font-family: 'Segoe UI', -apple-system, sans-serif; 
            background: radial-gradient(circle at 50% 0%, #2a2a35 0%, #111115 80%);
            background-attachment: fixed;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box;
            color: #fff;
        }

        /* --- СТИЛЬНАЯ КАРТОЧКА --- */
        .container { 
            background: rgba(30, 30, 35, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px; 
            border-radius: 16px; 
            border: 1px solid #ff4500; 
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.3); 
            width: 100%; 
            max-width: 400px; 
        }

        h1, h2 { 
            text-align: center; 
            color: #ff4500; 
            text-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
            margin-bottom: 20px;
        }

        /* --- ПОЛЯ ВВОДА --- */
        input { 
            width: 100%; 
            padding: 14px; 
            margin: 8px 0; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid #444; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            color: #fff;
            transition: 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #ff4500;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.3);
        }
        input::placeholder {
            color: #888;
        }

        /* --- КНОПКИ --- */
        button { 
            width: 100%; 
            padding: 14px; 
            background: #ff4500; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            margin-top: 10px; 
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover { 
            background: #ff5722; 
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.6);
        }

        .btn-green { background: #333; border: 1px solid #555; }
        .btn-green:hover { background: #444; box-shadow: 0 0 10px rgba(255, 255, 255, 0.2); }
        
        .btn-link { background: none; color: #aaa; box-shadow: none; text-transform: none; font-size: 14px; font-weight: normal; margin-top: 15px; text-decoration: underline; }
        .btn-link:hover { color: #fff; box-shadow: none; background: none; }

        /* --- ЗАМЕТКИ --- */
        .note { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 12px; 
            border-radius: 8px; 
            margin-top: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-left: 4px solid #ff4500; 
        }
        .note button { 
            width: auto; 
            background: #d32f2f; 
            padding: 6px 12px; 
            font-size: 12px; 
            margin: 0; 
        }
        .note button:hover { background: #f44336; }

        .hidden { display: none; }
        .error { color: #ff5252; text-align: center; margin-bottom: 10px; font-weight: bold; text-shadow: 0 0 5px rgba(255, 82, 82, 0.5); }
        .success { color: #4caf50; text-align: center; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- ЭКРАН 1: Вход -->
    <div id="auth-screen">
        <h1>🏍️ Вход</h1>
        <div id="auth-error" class="error"></div>
        <input type="text" id="username" placeholder="Логин">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()">Войти</button>
        <button class="btn-green" onclick="showScreen('register-screen')">Зарегистрироваться</button>
        <button class="btn-link" onclick="showScreen('recover-screen')">Забыли пароль?</button>
    </div>

    <!-- ЭКРАН 2: Регистрация -->
    <div id="register-screen" class="hidden">
        <h1>📝 Регистрация</h1>
        <div id="reg-error" class="error"></div>
        <div id="reg-success" class="success"></div>
        <input type="text" id="reg-username" placeholder="Придумайте логин">
        <input type="password" id="reg-password" placeholder="Придумайте пароль">
        <input type="tel" id="reg-phone" placeholder="Номер телефона">
        <input type="email" id="reg-email" placeholder="Электронная почта (Email)">
        <button onclick="register()">Создать аккаунт</button>
        <button class="btn-link" onclick="showScreen('auth-screen')">Назад ко входу</button>
    </div>

    <!-- ЭКРАН 3: Восстановление пароля -->
    <div id="recover-screen" class="hidden">
        <h1>🔑 Восстановление</h1>
        <div id="recover-error" class="error"></div>
        <div id="recover-success" class="success"></div>
        <p style="text-align: center; font-size: 14px; color: #aaa;">Введите вашу почту, и мы покажем ваш пароль.</p>
        <input type="email" id="recover-email" placeholder="Ваш Email">
        <button onclick="recoverPassword()">Восстановить</button>
        <button class="btn-link" onclick="showScreen('auth-screen')">Назад ко входу</button>
    </div>

    <!-- ЭКРАН 4: Личный кабинет -->
    <div id="dashboard-screen" class="hidden">
        <h2>Личный кабинет</h2>
        <p style="text-align: center;">Привет, <strong style="color: #ff4500;" id="user-display"></strong>!</p>
        <p style="text-align: center; font-size: 12px; color: #888;" id="user-info"></p>
        
        <h3 style="margin-top: 20px;">📝 Мои заметки</h3>
        <div id="notes-list"></div>
        
        <input type="text" id="new-note" placeholder="Новая запись...">
        <button onclick="addNote()">Добавить запись</button>
        <button onclick="logout()" class="btn-green" style="margin-top: 20px;">Выйти</button>
    </div>
</div>

<script>
    // Загружаем пользователей из памяти браузера
    let users = JSON.parse(localStorage.getItem('myAppUsers')) || {};
    let currentUser = null;

    function saveUsers() {
        localStorage.setItem('myAppUsers', JSON.stringify(users));
    }

    // Переключение экранов
    function showScreen(screenId) {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('register-screen').classList.add('hidden');
        document.getElementById('recover-screen').classList.add('hidden');
        document.getElementById('dashboard-screen').classList.add('hidden');
        
        document.getElementById(screenId).classList.remove('hidden');
        
        // Очищаем сообщения об ошибках при переходе
        document.getElementById('auth-error').innerText = '';
        document.getElementById('reg-error').innerText = '';
        document.getElementById('reg-success').innerText = '';
        document.getElementById('recover-error').innerText = '';
        document.getElementById('recover-success').innerText = '';
    }

    // --- РЕГИСТРАЦИЯ ---
    function register() {
        const u = document.getElementById('reg-username').value.trim();
        const p = document.getElementById('reg-password').value;
        const phone = document.getElementById('reg-phone').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const err = document.getElementById('reg-error');
        const succ = document.getElementById('reg-success');
        
        err.innerText = ''; succ.innerText = '';

        if (!u || !p || !phone || !email) {
            err.innerText = 'Пожалуйста, заполните все поля!';
            return;
        }
        if (users[u]) {
            err.innerText = 'Такой логин уже есть';
            return;
        }
        
        // Сохраняем пользователя со всеми данными
        users[u] = { password: p, phone: phone, email: email, notes: [] };
        saveUsers();
        
        succ.innerText = '✅ Успешно! Теперь можете войти.';
        setTimeout(() => {
            showScreen('auth-screen');
            // Автоматически подставляем логин для удобства
            document.getElementById('username').value = u; 
        }, 1500);
    }

    // --- ВХОД ---
    function login() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        
        if (users[u] && users[u].password === p) {
            currentUser = u;
            document.getElementById('user-display').innerText = u;
            document.getElementById('user-info').innerText = `📞 ${users[u].phone} | ✉️ ${users[u].email}`;
            showScreen('dashboard-screen');
            renderNotes();
        } else {
            document.getElementById('auth-error').innerText = 'Неверный логин или пароль';
            setTimeout(() => document.getElementById('auth-error').innerText = '', 3000);
        }
    }

    // --- ВОССТАНОВЛЕНИЕ ПАРОЛЯ ---
    function recoverPassword() {
        const email = document.getElementById('recover-email').value.trim();
        const err = document.getElementById('recover-error');
        const succ = document.getElementById('recover-success');
        
        err.innerText = ''; succ.innerText = '';

        if (!email) {
            err.innerText = 'Введите email';
            return;
        }

        // Ищем пользователя с такой почтой
        let foundUser = null;
        for (let login in users) {
            if (users[login].email === email) {
                foundUser = login;
                break;
            }
        }

        if (foundUser) {
            succ.innerHTML = `✅ Найдено!<br>Логин: <b>${foundUser}</b><br>Пароль: <b>${users[foundUser].password}</b>`;
        } else {
            err.innerText = 'Пользователь с такой почтой не найден.';
        }
    }

    // --- ВЫХОД ---
    function logout() {
        currentUser = null;
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        showScreen('auth-screen');
    }

    // --- ЗАМЕТКИ ---
    function renderNotes() {
        const list = document.getElementById('notes-list');
        list.innerHTML = '';
        const notes = users[currentUser].notes;
        
        if (notes.length === 0) {
            list.innerHTML = '<p style="color: #888; font-size: 14px;">Пока нет записей</p>';
        } else {
            notes.forEach((note, index) => {
                const div = document.createElement('div');
                div.className = 'note';
                div.innerHTML = `<span>${note}</span> <button onclick="deleteNote(${index})">Удалить</button>`;
                list.appendChild(div);
            });
        }
    }

    function addNote() {
        const noteInput = document.getElementById('new-note');
        const text = noteInput.value.trim();
        if (text) {
            users[currentUser].notes.push(text);
            saveUsers();
            noteInput.value = '';
            renderNotes();
        }
    }

    function deleteNote(index) {
        users[currentUser].notes.splice(index, 1);
        saveUsers();
        renderNotes();
    }
</script>

</body>
</html>
