<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Музыка</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', -apple-system, sans-serif; 
            background: #000; color: #fff;
            height: 100vh; display: flex; overflow: hidden;
        }

        /* --- БОКОВОЕ МЕНЮ --- */
        .sidebar {
            width: 250px; background: #0a0a0a; padding: 20px;
            display: flex; flex-direction: column; border-right: 1px solid #222;
        }
        .logo { font-size: 24px; font-weight: bold; color: #ffdb4d; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .menu-item { padding: 12px 10px; color: #aaa; cursor: pointer; border-radius: 8px; margin-bottom: 5px; transition: 0.2s; font-weight: 500; }
        .menu-item:hover { background: #1a1a1a; color: #fff; }
        .menu-item.active { color: #ffdb4d; background: #111; }
        .auth-btn { background: #ffdb4d; color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: auto; }
        .auth-btn:hover { background: #ffe680; }

        /* --- ГЛАВНАЯ ОБЛАСТЬ --- */
        .main-content {
            flex: 1; background: linear-gradient(180deg, #111 0%, #000 100%);
            padding: 40px; overflow-y: auto; position: relative; padding-bottom: 120px;
        }

        /* Авторизация */
        .auth-box { max-width: 400px; margin: 100px auto; background: #111; padding: 30px; border-radius: 16px; border: 1px solid #333; }
        .auth-box h2 { margin-bottom: 20px; color: #ffdb4d; text-align: center; }
        .auth-box input { width: 100%; padding: 12px; margin-bottom: 10px; background: #222; border: 1px solid #333; border-radius: 8px; color: #fff; }
        .auth-box input:focus { outline: none; border-color: #ffdb4d; }
        .auth-box button { width: 100%; padding: 12px; background: #ffdb4d; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .error { color: #ff5252; text-align: center; margin-bottom: 10px; font-size: 14px; }
        .link-btn { background: none; border: none; color: #aaa; cursor: pointer; text-decoration: underline; margin-top: 15px; width: 100%; font-size: 14px; }

        .hidden { display: none !important; }
        .header-title { font-size: 32px; font-weight: bold; margin-bottom: 30px; }

        /* Сетка треков */
        .tracks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .track-card { background: #111; padding: 15px; border-radius: 12px; transition: 0.2s; cursor: pointer; position: relative; }
        .track-card:hover { background: #222; }
        .track-cover { width: 100%; aspect-ratio: 1; background: linear-gradient(45deg, #ffdb4d, #ff4500); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 10px; overflow: hidden; }
        .track-cover img { width: 100%; height: 100%; object-fit: cover; }
        .track-name { font-weight: bold; font-size: 14px; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 12px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-actions { display: flex; justify-content: space-between; margin-top: 10px; }
        .track-actions button { background: none; border: none; color: #aaa; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .track-actions button:hover { color: #ffdb4d; }
        .fav-active { color: #ff4500 !important; }

        /* ПЛЕЕР ВНИЗУ */
        .player-bar {
            position: fixed; bottom: 0; left: 0; right: 0; height: 80px;
            background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid #222; display: flex; align-items: center;
            padding: 0 30px; gap: 20px; z-index: 100;
        }
        .player-cover { width: 50px; height: 50px; background: #ffdb4d; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .player-cover img { width: 100%; height: 100%; object-fit: cover; }
        .player-info { width: 250px; }
        .player-title { font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-artist { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-controls { flex: 1; display: flex; justify-content: center; align-items: center; gap: 20px; }
        .play-btn { width: 40px; height: 40px; border-radius: 50%; background: #fff; color: #000; border: none; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .play-btn:hover { transform: scale(1.05); }
        audio { display: none; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        
        /* Анимация загрузки */
        .loader { text-align: center; color: #ffdb4d; font-size: 18px; margin-top: 50px; }
    </style>
</head>
<body>

    <!-- ЛЕВОЕ МЕНЮ -->
    <div class="sidebar">
        <div class="logo">🎵 Моя Музыка</div>
        <div class="menu-item active" id="menu-wave" onclick="showScreen('wave-screen'); loadWave()">🌊 Моя волна</div>
        <div class="menu-item" id="menu-fav" onclick="showScreen('fav-screen')">❤️ Избранное</div>
        <div class="menu-item" id="menu-settings" onclick="showScreen('settings-screen')">⚙️ Настройки</div>
        
        <button class="auth-btn" id="logout-btn" onclick="logout()" style="display:none;">Выйти</button>
    </div>

    <!-- ПРАВАЯ ЧАСТЬ -->
    <div class="main-content">
        
        <!-- ЭКРАН АВТОРИЗАЦИИ -->
        <div id="auth-screen">
            <div class="auth-box">
                <h2>Вход</h2>
                <div id="auth-error" class="error"></div>
                <input type="text" id="username" placeholder="Логин">
                <input type="password" id="password" placeholder="Пароль">
                <button onclick="login()">Войти</button>
                <button class="link-btn" onclick="showScreen('register-screen')">Нет аккаунта? Зарегистрироваться</button>
            </div>
        </div>

        <!-- ЭКРАН РЕГИСТРАЦИИ -->
        <div id="register-screen" class="hidden">
            <div class="auth-box">
                <h2>Регистрация</h2>
                <div id="reg-error" class="error"></div>
                <input type="text" id="reg-username" placeholder="Логин">
                <input type="password" id="reg-password" placeholder="Пароль">
                <input type="email" id="reg-email" placeholder="Email">
                <button onclick="register()">Создать аккаунт</button>
                <button class="link-btn" onclick="showScreen('auth-screen')">Назад</button>
            </div>
        </div>

        <!-- ЭКРАН "МОЯ ВОЛНА" -->
        <div id="wave-screen" class="hidden">
            <div class="header-title">🌊 Моя волна</div>
            <p style="color: #888; margin-bottom: 20px;">Бесконечный поток случайных треков. Нажмите на трек, чтобы слушать.</p>
            <div class="tracks-grid" id="wave-list"></div>
        </div>

        <!-- ЭКРАН ИЗБРАННОГО -->
        <div id="fav-screen" class="hidden">
            <div class="header-title">Избранное ❤️</div>
            <div class="tracks-grid" id="fav-list"></div>
        </div>

        <!-- ЭКРАН НАСТРОЕК -->
        <div id="settings-screen" class="hidden">
            <div class="header-title">Настройки</div>
            <div style="background: #111; padding: 20px; border-radius: 12px;">
                <p style="margin-bottom: 15px; font-weight: bold;">Поддержка:</p>
                <button onclick="contactSupport()" style="padding: 10px 20px; background: #ffdb4d; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Написать нам</button>
            </div>
        </div>

    </div>

    <!-- ПЛЕЕР -->
    <div class="player-bar hidden" id="player-bar">
        <div class="player-cover" id="player-cover">🎵</div>
        <div class="player-info">
            <div class="player-title" id="player-title">Выберите трек</div>
            <div class="player-artist" id="player-artist">Неизвестен</div>
        </div>
        <div class="player-controls">
            <button class="play-btn" id="play-pause-btn" onclick="togglePlay()">▶</button>
        </div>
        <audio id="audio-player" onended="nextTrack()"></audio>
    </div>

<script>
    let users = JSON.parse(localStorage.getItem('myAppUsers')) || {};
    let currentUser = null;
    
    // Состояние плеера
    let currentPlaylist = [];
    let currentTrackIndex = -1;
    let isPlaying = false;
    const audio = document.getElementById('audio-player');

    // --- АВТОРИЗАЦИЯ ---
    function showScreen(screenId) {
        const screens = ['auth-screen', 'register-screen', 'wave-screen', 'fav-screen', 'settings-screen'];
        screens.forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
        document.getElementById('auth-error').innerText = '';
        document.getElementById('reg-error').innerText = '';
        
        if (screenId === 'auth-screen' || screenId === 'register-screen') {
            document.getElementById('player-bar').classList.add('hidden');
        } else {
            document.getElementById('player-bar').classList.remove('hidden');
        }
    }

    function register() {
        const u = document.getElementById('reg-username').value.trim();
        const p = document.getElementById('reg-password').value;
        const email = document.getElementById('reg-email').value.trim();
        
        if (!u || !p || !email) return document.getElementById('reg-error').innerText = 'Заполните все поля!';
        if (users[u]) return document.getElementById('reg-error').innerText = 'Логин занят';
        
        users[u] = { password: p, email: email, favorites: [] };
        saveData();
        alert('Успешно! Войдите.');
        showScreen('auth-screen');
    }

    function login() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        
        if (users[u] && users[u].password === p) {
            currentUser = u;
            document.getElementById('logout-btn').style.display = 'block';
            showScreen('wave-screen');
            loadWave(); // Сразу включаем волну
        } else {
            document.getElementById('auth-error').innerText = 'Неверный логин или пароль';
        }
    }

    function logout() {
        currentUser = null;
        audio.pause();
        document.getElementById('logout-btn').style.display = 'none';
        showScreen('auth-screen');
    }

    function saveData() { localStorage.setItem('myAppUsers', JSON.stringify(users)); }

    // --- "МОЯ ВОЛНА" (Загрузка с бесплатного API Audius) ---
    async function loadWave() {
        const list = document.getElementById('wave-list');
        list.innerHTML = '<div class="loader">🌊 Подбираем треки для вас...</div>';

        try {
            // Запрос к открытому API Audius (бесплатная музыка)
            const response = await fetch('https://discoveryprovider.audius.co/v1/tracks/trending?app_name=MyMotoApp&limit=15');
            const data = await response.json();
            
            list.innerHTML = ''; // Очищаем лоадер
            let waveTracks = [];

            data.data.forEach(track => {
                // Берем обложку и ссылку на стриминг
                const coverUrl = track.artwork ? track.artwork['150x150'] : '';
                const streamUrl = `https://discoveryprovider.audius.co/v1/tracks/${track.id}/stream?app_name=MyMotoApp`;
                
                const trackData = {
                    id: track.id,
                    name: track.title,
                    artist: track.user.name,
                    cover: coverUrl,
                    url: streamUrl
                };
                waveTracks.push(trackData);

                // Отрисовка карточки
                const isFav = users[currentUser].favorites.some(f => f.id === track.id);
                list.innerHTML += `
                    <div class="track-card">
                        <div class="track-cover" onclick="playFromWave(${track.id})">
                            ${coverUrl ? `<img src="${coverUrl}" alt="cover">` : '🎵'}
                        </div>
                        <div class="track-name" title="${track.title}">${track.title}</div>
                        <div class="track-artist" title="${track.user.name}">${track.user.name}</div>
                        <div class="track-actions">
                            <button class="${isFav ? 'fav-active' : ''}" onclick="toggleFavWave(${track.id})">${isFav ? '❤️' : '🤍'}</button>
                        </div>
                    </div>
                `;
            });

            // Сохраняем текущий плейлист волны в память
            window.currentWave = waveTracks;

        } catch (error) {
            list.innerHTML = '<div class="loader" style="color: red;">Ошибка загрузки. Проверьте интернет.</div>';
            console.error(error);
        }
    }

    // --- ИЗБРАННОЕ ---
    function toggleFavWave(trackId) {
        const track = window.currentWave.find(t => t.id === trackId);
        const favs = users[currentUser].favorites;
        const index = favs.findIndex(f => f.id === trackId);

        if (index === -1) {
            favs.push(track); // Добавляем
        } else {
            favs.splice(index, 1); // Удаляем
        }
        
        saveData();
        loadWave(); // Перерисовываем сердечки
        if (document.getElementById('fav-screen').classList.contains('hidden') === false) {
            renderFavorites();
        }
    }

    function renderFavorites() {
        const list = document.getElementById('fav-list');
        list.innerHTML = '';
        const favs = users[currentUser].favorites || [];

        if (favs.length === 0) {
            list.innerHTML = '<p style="color: #888;">Пока пусто. Добавьте треки из "Моей волны".</p>';
            return;
        }

        favs.forEach((track, index) => {
            list.innerHTML += `
                <div class="track-card">
                    <div class="track-cover" onclick="playFromFav(${index})">
                        ${track.cover ? `<img src="${track.cover}">` : '🎵'}
                    </div>
                    <div class="track-name" title="${track.name}">${track.name}</div>
                    <div class="track-artist" title="${track.artist}">${track.artist}</div>
                    <div class="track-actions">
                        <button class="fav-active" onclick="removeFav(${index})">❤️</button>
                    </div>
                </div>
            `;
        });
    }

    function removeFav(index) {
        users[currentUser].favorites.splice(index, 1);
        saveData();
        renderFavorites();
    }

    // --- ПЛЕЕР ---
    function playFromWave(trackId) {
        const track = window.currentWave.find(t => t.id === trackId);
        currentPlaylist = window.currentWave;
        currentTrackIndex = currentPlaylist.findIndex(t => t.id === trackId);
        loadAndPlay();
    }

    function playFromFav(index) {
        currentPlaylist = users[currentUser].favorites;
        currentTrackIndex = index;
        loadAndPlay();
    }

    function loadAndPlay() {
        const track = currentPlaylist[currentTrackIndex];
        if (!track) return;

        document.getElementById('player-title').innerText = track.name;
        document.getElementById('player-artist').innerText = track.artist;
        
        const coverBox = document.getElementById('player-cover');
        if (track.cover) {
            coverBox.innerHTML = `<img src="${track.cover}">`;
        } else {
            coverBox.innerHTML = '🎵';
        }

        audio.src = track.url;
        audio.play().catch(e => console.log("Ошибка воспроизведения:", e));
        isPlaying = true;
        document.getElementById('play-pause-btn').innerText = '⏸';
    }

    function togglePlay() {
        if (!audio.src) return;
        if (isPlaying) {
            audio.pause();
            document.getElementById('play-pause-btn').innerText = '▶';
        } else {
            audio.play();
            document.getElementById('play-pause-btn').innerText = '⏸';
        }
        isPlaying = !isPlaying;
    }

    function nextTrack() {
        if (currentTrackIndex < currentPlaylist.length - 1) {
            currentTrackIndex++;
            loadAndPlay();
        } else {
            // Если плейлист закончился, включаем следующую волну
            if (currentPlaylist === window.currentWave) {
                loadWave().then(() => {
                    // Автоматически включаем первый трек из новой волны
                    setTimeout(() => {
                        if(window.currentWave.length > 0) playFromWave(window.currentWave[0].id);
                    }, 1000);
                });
            }
        }
    }

    function contactSupport() {
        window.location.href = "mailto:support@moto-site.ru?subject=Вопрос в поддержку";
    }

    // Переключение меню
    document.getElementById('menu-wave').onclick = () => { showScreen('wave-screen'); loadWave(); };
    document.getElementById('menu-fav').onclick = () => { showScreen('fav-screen'); renderFavorites(); };
    document.getElementById('menu-settings').onclick = () => { showScreen('settings-screen'); };

</script>

</body>
</html>
